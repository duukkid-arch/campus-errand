server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/errand?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: errand
    # 与 .env 里的 MYSQL_ROOT_PASSWORD 保持一致，默认 root123456
    password: ${MYSQL_ROOT_PASSWORD:root123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: 127.0.0.1
      port: 6379

mybatis-plus:
  configuration:
    # 数据库下划线字段自动映射成 Java 驼峰属性
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
